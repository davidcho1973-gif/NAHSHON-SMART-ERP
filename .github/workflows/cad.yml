name: CAD DWG roundtrip

on:
  pull_request:
    paths:
      - 'services/cad-converter/**'
      - 'public/js/cad-*.js'
      - 'app/**/Cad*.php'
      - 'tests/Feature/CadDrawingTest.php'
      - 'tests/Feature/CadWorkflowTest.php'
      - 'tests/Fixtures/cad-line.dxf'
      - 'tests/Fixtures/cad-presentation.*'
      - 'tests/cad-converter/**'
      - 'tests/js/cad-core.test.mjs'
      - 'tests/js/cad-2d-editing.test.mjs'
      - 'tests/js/cad-native-edit.test.mjs'
      - 'tests/js/cad-native-dimension.test.mjs'
      - 'tests/Fixtures/cad-native-edit.cjs'
      - 'tests/js/cad-numeric.test.mjs'
      - 'tests/js/cad-sketch.test.mjs'
      - 'tests/js/cad-export-large.test.mjs'
      - 'tests/js/cad-history.test.mjs'
      - 'tests/Fixtures/cad-history.cjs'
      - 'tests/js/cad-markup.test.mjs'
      - 'tests/js/cad-markup-geometry.test.mjs'
      - 'tests/js/cad-markup-drafting.test.mjs'
      - 'tests/js/cad-print.test.mjs'
      - 'tests/js/cad-fidelity.test.mjs'
      - 'tests/js/cad-review.test.mjs'
      - 'scripts/test-cad-roundtrip.mjs'
      - 'scripts/test-cad-native-edit.mjs'
      - 'scripts/build-cad-converter.sh'
      - '.github/workflows/cad.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cad:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: nahshon_smart_erp_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_URL: ''
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nahshon_smart_erp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nahshon_smart_erp_test"
          --health-interval=10s --health-timeout=5s --health-retries=5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, curl, gd, libxml, mbstring, zip, sodium, pdo_pgsql
          coverage: none
      - name: Build actual DWG engine
        run: dotnet build services/cad-converter/CadConverter.csproj -c Release -p:RestoreLockedMode=true
      - name: Browser geometry and DWG bytes roundtrip
        run: |
          node --test tests/js/cad-core.test.mjs
          node --test tests/js/cad-2d-editing.test.mjs
          node --test tests/js/cad-native-edit.test.mjs
          node --test tests/js/cad-native-dimension.test.mjs
          node --test tests/js/cad-numeric.test.mjs
          node --test tests/js/cad-sketch.test.mjs
          node --test tests/js/cad-export-large.test.mjs
          node --test tests/js/cad-history.test.mjs
          node --test tests/js/cad-markup.test.mjs
          node --test tests/js/cad-markup-geometry.test.mjs
          node --test tests/js/cad-markup-drafting.test.mjs
          node --test tests/js/cad-print.test.mjs
          node --test tests/js/cad-fidelity.test.mjs
          node --test tests/js/cad-review.test.mjs
          node scripts/test-cad-roundtrip.mjs "$(command -v dotnet)" "$GITHUB_WORKSPACE/services/cad-converter/bin/Release/net8.0/Nahshon.CadConverter.dll" "$RUNNER_TEMP/cad-roundtrip"
          node scripts/test-cad-native-edit.mjs "$(command -v dotnet)" "$GITHUB_WORKSPACE/services/cad-converter/bin/Release/net8.0/Nahshon.CadConverter.dll" "$RUNNER_TEMP/cad-native-edit"
      - name: Real duplicate book colors and conflicting RGB rejection
        run: dotnet run --project tests/cad-converter/CadCompatibilityTests.csproj -c Release -- "$(command -v dotnet)" "$GITHUB_WORKSPACE/services/cad-converter/bin/Release/net8.0/Nahshon.CadConverter.dll"
      - name: Prepare Laravel
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          cp .env.example .env
          php artisan key:generate
      - name: Actual DWG upload, edit, revision, download and reimport
        run: |
          export CAD_TEST_CONVERTER_BINARY="$GITHUB_WORKSPACE/services/cad-converter/bin/Release/net8.0/Nahshon.CadConverter.dll"
          export CAD_TEST_DOTNET_BINARY="$(command -v dotnet)"
          php vendor/bin/phpunit --filter 'CadDrawingTest|CadWorkflowTest'
      - name: Publish Linux server converter
        run: bash scripts/build-cad-converter.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nahshon-cad-converter-linux-x64
          path: services/cad-converter/publish
