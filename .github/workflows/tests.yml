name: Tests

on:
  push:
    branches:
      # staging 은 실제로 배포되는 브랜치인데 여기 빠져 있어서 테스트가 한 번도 돌지
      # 않았다. 배포되는 브랜치일수록 CI 가 먼저 봐야 한다.
      - main
      - staging
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nahshon_smart_erp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nahshon_smart_erp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: true
      matrix:
        php: [8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Execute tests
        run: php artisan test

  # ──────────────────────────────────────────────────────────────────────────
  # 배포 트리거.
  #
  # Laravel Cloud 의 자동 배포(GitHub 연동)가 멈춰도 배포가 나가게 하는 두 번째 경로다.
  # 대시보드의 Deploy Hook URL 을 저장소 시크릿에 넣어 두면, 테스트가 통과한 뒤
  # 그 주소를 호출한다. 어느 브랜치를 보고 있는지 같은 대시보드 설정에 의존하지 않는다.
  #
  # 시크릿이 없으면 조용히 건너뛴다 — 설정 전까지 저장소를 빨갛게 만들 이유가 없다.
  #   Settings → Secrets and variables → Actions → New repository secret
  #   이름: LARAVEL_CLOUD_DEPLOY_HOOK_STAGING
  deploy-staging:
    name: Deploy staging
    needs: tests
    # 브랜치는 staging 으로 못 박되, 푸시 말고 수동 실행(Run workflow)으로도 돌 수 있게 한다.
    # 배포만 다시 밀어야 하는 상황(설정 변경, 배포 유실)에 빈 커밋을 만들 이유가 없다.
    if: >-
      github.ref == 'refs/heads/staging' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Laravel Cloud deployment
        env:
          HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK_STAGING }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice title=배포 건너뜀::LARAVEL_CLOUD_DEPLOY_HOOK_STAGING 시크릿이 없습니다."
            echo "Laravel Cloud → 환경 → Deploy Hook 의 URL 을 저장소 시크릿에 넣으면"
            echo "staging 에 푸시할 때마다 테스트 통과 후 자동으로 배포됩니다."
            exit 0
          fi

          # commit_hash 를 붙여 "테스트를 통과한 그 커밋" 을 콕 집어 배포한다.
          # 안 붙이면 Laravel Cloud 가 호출 시점의 브랜치 최신 커밋을 가져가는데,
          # 테스트가 도는 동안 푸시가 하나 더 들어오면 검증 안 된 커밋이 나간다.
          sep='?'
          case "$HOOK" in *\?*) sep='&' ;; esac
          with_hash="${HOOK}${sep}commit_hash=${GITHUB_SHA}"

          # 훅의 호출 규약(메서드·파라미터 허용 여부)은 대시보드에 적혀 있지 않고
          # 여기서 문서를 열 수도 없다. 그래서 좁은 것부터 넓은 것 순으로 시도하고
          # 처음 2xx 가 나오는 조합에서 멈춘다. 로그에는 조합 이름과 응답 코드만 남는다.
          #
          # 순서가 곧 우선순위다. commit_hash 가 붙은 쪽이 배포 대상이 정확하므로 먼저 본다.
          try() {
            curl -sS -o /tmp/hook.out -w '%{http_code}' -X "$1" "$2" --max-time 60 || echo 000
          }

          code=''
          chosen=''
          for combo in \
            "POST|$with_hash|POST + commit_hash" \
            "POST|$HOOK|POST (파라미터 없이)" \
            "GET|$with_hash|GET + commit_hash" \
            "GET|$HOOK|GET (파라미터 없이)"
          do
            method=${combo%%|*}
            rest=${combo#*|}
            url=${rest%%|*}
            label=${rest#*|}

            c=$(try "$method" "$url")
            echo "  $label → HTTP $c"
            case "$c" in
              2*) code=$c; chosen=$label; break ;;
            esac
            last=$c
          done

          if [ -n "$code" ]; then
            echo "::notice title=배포 시작됨::$chosen 으로 ${GITHUB_SHA:0:7} 배포를 요청했습니다 (HTTP $code)."
            head -c 300 /tmp/hook.out || true
            echo
            exit 0
          fi

          echo "마지막 응답 본문:"
          head -c 500 /tmp/hook.out || true
          echo

          case "$last" in
            000) echo "::error title=배포 요청 실패::Deploy Hook 에 연결하지 못했습니다." ;;
            # 리다이렉트를 -L 로 따라가지 않는 이유: 따라가면 첫 화면 HTML 을 200 으로
            # 받아 배포가 성공한 것으로 오인하게 된다. 실패로 남기는 편이 정직하다.
            3*) echo "::error title=훅이 응답하지 않음::네 조합 모두 리다이렉트됐습니다. 주소 형태는 훅이 맞으니, 대시보드에서 Deploy hook 이 켜져 있는지와 훅이 재발급되지 않았는지 확인하세요." ;;
            401|403) echo "::error title=훅이 거부됨::HTTP $last — 토큰이 만료됐거나 재발급된 것 같습니다. 재발급 후 시크릿을 갱신하세요." ;;
            404) echo "::error title=훅을 찾을 수 없음::HTTP $last — 주소 일부만 복사됐거나 훅이 삭제된 것 같습니다." ;;
            *)   echo "::error title=배포 요청 거부됨::HTTP $last — 어느 조합도 통하지 않았습니다." ;;
          esac
          exit 1

      # 훅 호출이 실패했을 때 "무엇을 넣으셨는지" 를 값 노출 없이 되짚어 준다.
      # 응답 코드만으로는 추측이 반복된다. 호스트·경로 모양·길이면 대시보드 주소인지
      # 훅 주소인지 갈린다. 토큰이 들어 있는 마지막 구간은 길이만 세고 절대 찍지 않는다.
      - name: Diagnose the hook URL shape
        if: failure()
        env:
          HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK_STAGING }}
        run: |
          scheme=$(printf '%s' "$HOOK" | sed -n 's#^\([a-zA-Z][a-zA-Z0-9+.-]*\)://.*#\1#p')
          host=$(printf '%s' "$HOOK" | sed -e 's#^[a-zA-Z][a-zA-Z0-9+.-]*://##' -e 's#[/?].*##')
          path=$(printf '%s' "$HOOK" | sed -e 's#^[a-zA-Z][a-zA-Z0-9+.-]*://[^/?]*##' -e 's#?.*##')

          echo "프로토콜: ${scheme:-없음(주소가 http(s):// 로 시작하지 않습니다)}"
          echo "호스트: ${host:-읽지 못함}"
          echo "전체 길이: ${#HOOK}자"
          echo "경로 구간:"
          # `|| [ -n "$seg" ]` 가 없으면 개행으로 끝나지 않는 마지막 구간을 read 가 버린다.
          # 하필 그 마지막 구간이 토큰이라, 있는지 없는지가 진단의 핵심이다.
          printf '%s' "$path" | tr '/' '\n' | while IFS= read -r seg || [ -n "$seg" ]; do
            [ -z "$seg" ] && continue
            # 순수하게 소문자와 하이픈뿐인 짧은 구간만 사람이 읽는 단어로 보고 그대로 찍는다.
            # 숫자나 대문자가 하나라도 섞였으면 토큰일 수 있으니 길이만 남긴다.
            rest=$(printf '%s' "$seg" | tr -d 'a-z-')
            if [ -z "$rest" ] && [ "${#seg}" -le 20 ]; then
              echo "  /$seg"
            else
              echo "  /<${#seg}자>"
            fi
          done

          echo
          echo "판별:"
          case "$path" in
            *projects*|*environments*|*settings*|*dashboard*)
              echo "  ✗ 경로에 대시보드 화면 이름이 들어 있습니다 — 브라우저 주소창 URL 입니다." ;;
            *hook*|*deploy*)
              echo "  ~ 훅처럼 생겼지만 302 가 났습니다. 토글을 켜기 전 예시 주소를 넣었거나, 훅이 재발급되어 주소가 바뀐 경우입니다." ;;
            *)
              echo "  ? 알려진 어느 형태와도 다릅니다." ;;
          esac

      - name: Verify the deployed build
        if: success()
        env:
          BASE: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::notice title=확인 건너뜀::STAGING_URL 변수가 없어 배포 결과를 확인하지 못했습니다."
            exit 0
          fi

          # 배포는 비동기라 잠시 기다렸다가 /build-version 이 이번 커밋으로 바뀌는지 본다.
          want="${GITHUB_SHA:0:7}"
          for i in $(seq 1 20); do
            sleep 30
            got=$(curl -sS --max-time 20 "$BASE/build-version" | sed -n 's/.*"commit_short" *: *"\([^"]*\)".*/\1/p')
            echo "  ${i}회차 — 서버: ${got:-응답없음} / 기대: $want"
            if [ "$got" = "$want" ]; then
              echo "::notice title=배포 확인됨::$want 가 staging 에 반영되었습니다."
              exit 0
            fi
          done
          echo "::warning title=확인 못 함::10분 안에 $want 로 바뀌지 않았습니다. Laravel Cloud 배포 로그를 확인하세요."
