name: Tests

on:
  push:
    branches:
      # staging 은 실제로 배포되는 브랜치인데 여기 빠져 있어서 테스트가 한 번도 돌지
      # 않았다. 배포되는 브랜치일수록 CI 가 먼저 봐야 한다.
      - main
      - staging
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nahshon_smart_erp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nahshon_smart_erp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: true
      matrix:
        # 배포되는 곳과 같은 버전으로 시험한다. Laravel Cloud 가 PHP 8.5 로 돌고 있는데
        # 8.4 로만 시험하면, 8.5 에서만 나는 문제를 운영에서 처음 만나게 된다.
        php: [8.5]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Execute tests
        run: php artisan test


  # ──────────────────────────────────────────────────────────────────────────
  # 배포.
  #
  # 두 갈래로 배포가 나간다.
  #   1. Laravel Cloud 대시보드의 "Push to deploy" — 푸시를 감지해 알아서 배포
  #   2. 여기서 부르는 Deploy Hook — 테스트가 통과한 뒤에만, 그 커밋을 콕 집어서
  #
  # 2번이 있는 이유는 1번이 검증 없이 배포하기 때문이다. 반대로 2번이 막혀도
  # 1번으로 배포는 나간다. 그래서 훅 실패는 경고고, 성패는 "서버가 실제로 바뀌었는가"
  # 하나로만 가른다 — verify-build.sh 가 서버에 직접 물어본다.
  #
  # 설정할 것 (환경별로 하나씩):
  #   Settings → Secrets and variables → Actions
  #     Secrets   : LARAVEL_CLOUD_DEPLOY_HOOK_STAGING / ..._PRODUCTION
  #                 ← Laravel Cloud → Settings → Deployments → Deploy hook URL
  #                   (입력칸에서 잘려 보이므로 반드시 복사 버튼을 쓸 것)
  #     Variables : STAGING_URL / PRODUCTION_URL
  #
  # 둘 다 없으면 조용히 건너뛴다. 설정 전까지 저장소를 빨갛게 만들 이유가 없다.
  deploy-staging:
    name: Deploy staging
    needs: tests
    # 브랜치는 못 박되, 푸시 말고 수동 실행(Run workflow)으로도 돌 수 있게 한다.
    # 배포만 다시 밀어야 하는 상황에 의미 없는 빈 커밋을 만들 이유가 없다.
    if: >-
      github.ref == 'refs/heads/staging' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      ENV_LABEL: staging

    steps:
      - uses: actions/checkout@v7

      - name: Trigger Laravel Cloud deployment
        id: hook
        env:
          HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK_STAGING }}
        run: bash scripts/deploy/trigger-hook.sh

      - name: Diagnose the hook URL shape
        if: steps.hook.outputs.ok != 'true'
        env:
          HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK_STAGING }}
        run: bash scripts/deploy/diagnose-hook.sh

      - name: Verify the deployed build
        if: always()
        env:
          BASE: ${{ vars.STAGING_URL }}
        run: bash scripts/deploy/verify-build.sh

      # 스케줄러가 꺼져 있으면 앱은 멀쩡해 보이는 채로 자동 퇴근·문서 분석·경비 계상이
      # 전부 멈춘다. 배포는 어차피 결과를 들여다보는 순간이라 여기서 함께 본다.
      - name: Check the scheduler
        if: always()
        env:
          BASE: ${{ vars.STAGING_URL }}
        run: bash scripts/deploy/check-scheduler.sh

  # 운영. staging 과 같은 구조이고, 다른 것은 브랜치와 시크릿 이름뿐이다.
  #
  # main 에 올리는 것 자체가 이미 의도적인 행동이므로 별도 승인 단계는 두지 않았다.
  # 사람의 확인을 한 번 더 받고 싶으면 GitHub 의 Environments 에 production 환경을
  # 만들고 required reviewers 를 걸면 된다 — 그때는 이 잡에 environment: production 만 붙이면 된다.
  deploy-production:
    name: Deploy production
    needs: tests
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      ENV_LABEL: 운영

    steps:
      - uses: actions/checkout@v7

      - name: Trigger Laravel Cloud deployment
        id: hook
        env:
          HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK_PRODUCTION }}
        run: bash scripts/deploy/trigger-hook.sh

      - name: Diagnose the hook URL shape
        if: steps.hook.outputs.ok != 'true'
        env:
          HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK_PRODUCTION }}
        run: bash scripts/deploy/diagnose-hook.sh

      - name: Verify the deployed build
        if: always()
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
        run: bash scripts/deploy/verify-build.sh

      # 스케줄러가 꺼져 있으면 앱은 멀쩡해 보이는 채로 자동 퇴근·문서 분석·경비 계상이
      # 전부 멈춘다. 배포는 어차피 결과를 들여다보는 순간이라 여기서 함께 본다.
      - name: Check the scheduler
        if: always()
        env:
          BASE: ${{ vars.PRODUCTION_URL }}
        run: bash scripts/deploy/check-scheduler.sh

  # ──────────────────────────────────────────────────────────────────────────
  # 나손(NAHSHON MEP) — David 가 매일 쓰는 곳. 배포도 확인도 여기가 먼저다.
  #
  # > "지금 내가 작업하는 것은 나손이고 앞으로 나손으로 배포해줘" (David 2026-09-05)
  #
  # 오랫동안 나손만 훅이 없어 Laravel Cloud 의 «Push to deploy» 에만 기대고 있었고,
  # 그 경로는 GitHub 에 아무 기록을 남기지 않는다. 그래서 「나손에 배포됐어?」 에 아무도
  # 답할 수 없었고, 실제로 이틀 동안 옛 커밋에 멈춰 있었는데 아무도 몰랐다(2026-09-03~05).
  # 이제 훅이 있어 다른 둘과 같은 모양으로 돈다.
  #
  # 이름이 헷갈리는 자리라 한 번 더 적는다 — PRODUCTION 은 DASOL 원본이고,
  # STAGING 은 KSR 이다. 나손은 이 잡이다(DEPLOYMENT_ENVIRONMENTS.md).
  deploy-nahshon:
    name: Deploy NAHSHON
    needs: tests
    # main 에서만 돈다. staging 에도 같은 커밋을 올리므로 양쪽에서 돌리면 같은 커밋을
    # 두 번 배포하게 된다 — 빌드 시간만 쓰고 서버는 공연히 한 번 더 재시작한다.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      ENV_LABEL: 나손(NAHSHON MEP)
      # 주소는 변수로 두되 기본값을 함께 적는다 — 변수를 안 넣었다고 확인이 조용히
      # 꺼지면, 확인이 없던 예전 상태로 되돌아간다(그게 이 사고의 원인이었다).
      # 자체 도메인이 붙으면 Variables 의 NAHSHON_URL 만 바꾸면 된다.
      BASE: ${{ vars.NAHSHON_URL || 'https://nahshon-smart-erp-nahshon-mep-hntasf.laravel.cloud' }}

    steps:
      - uses: actions/checkout@v7

      - name: Trigger Laravel Cloud deployment
        id: hook
        env:
          HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK_NAHSHON }}
          HOOK_NAME: LARAVEL_CLOUD_DEPLOY_HOOK_NAHSHON
        run: bash scripts/deploy/trigger-hook.sh

      # 이미 잘 되는 훅을 비교용으로 함께 넘긴다 — 값은 어느 쪽도 출력되지 않고
      # 길이만 나란히 찍힌다. 「토큰이 짧다」 가 추측이 아니라 비교가 된다.
      - name: Diagnose the hook URL shape
        if: steps.hook.outputs.ok != 'true'
        env:
          HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK_NAHSHON }}
          REFERENCE_HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK_PRODUCTION }}
          REFERENCE_LABEL: 잘 되는 훅
        run: bash scripts/deploy/diagnose-hook.sh

      # 훅이 있으면 다른 둘과 같은 잣대로 판정한다 — 서버가 그 커밋으로 바뀌지 않으면 실패다.
      - name: Verify the deployed build
        if: always() && steps.hook.outputs.has_hook == 'true'
        run: bash scripts/deploy/verify-build.sh

      # 시크릿 이름이 틀려 값이 비어 온 경우. 이때 실패로 몰면 «내가 시키지도 못한 배포» 가
      # 늦다고 빨간 X 가 뜬다 — 적어만 두고, 위의 경고가 이름을 확인하라고 말한다.
      - name: Report the deployed build
        if: always() && steps.hook.outputs.has_hook != 'true'
        run: bash scripts/deploy/report-build.sh

      - name: Check the scheduler
        if: always()
        run: bash scripts/deploy/check-scheduler.sh
