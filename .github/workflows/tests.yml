name: Tests

on:
  push:
    branches:
      # staging 은 실제로 배포되는 브랜치인데 여기 빠져 있어서 테스트가 한 번도 돌지
      # 않았다. 배포되는 브랜치일수록 CI 가 먼저 봐야 한다.
      - main
      - staging
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nahshon_smart_erp
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d nahshon_smart_erp"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    strategy:
      fail-fast: true
      matrix:
        php: [8.4]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        run: php artisan migrate --force

      - name: Execute tests
        run: php artisan test

  # ──────────────────────────────────────────────────────────────────────────
  # 배포 트리거.
  #
  # Laravel Cloud 의 자동 배포(GitHub 연동)가 멈춰도 배포가 나가게 하는 두 번째 경로다.
  # 대시보드의 Deploy Hook URL 을 저장소 시크릿에 넣어 두면, 테스트가 통과한 뒤
  # 그 주소를 호출한다. 어느 브랜치를 보고 있는지 같은 대시보드 설정에 의존하지 않는다.
  #
  # 시크릿이 없으면 조용히 건너뛴다 — 설정 전까지 저장소를 빨갛게 만들 이유가 없다.
  #   Settings → Secrets and variables → Actions → New repository secret
  #   이름: LARAVEL_CLOUD_DEPLOY_HOOK_STAGING
  deploy-staging:
    name: Deploy staging
    needs: tests
    # 브랜치는 staging 으로 못 박되, 푸시 말고 수동 실행(Run workflow)으로도 돌 수 있게 한다.
    # 배포만 다시 밀어야 하는 상황(설정 변경, 배포 유실)에 빈 커밋을 만들 이유가 없다.
    if: >-
      github.ref == 'refs/heads/staging' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Laravel Cloud deployment
        env:
          HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK_STAGING }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice title=배포 건너뜀::LARAVEL_CLOUD_DEPLOY_HOOK_STAGING 시크릿이 없습니다."
            echo "Laravel Cloud → 환경 → Deploy Hook 의 URL 을 저장소 시크릿에 넣으면"
            echo "staging 에 푸시할 때마다 테스트 통과 후 자동으로 배포됩니다."
            exit 0
          fi

          # commit_hash 를 붙여 "테스트를 통과한 그 커밋" 을 콕 집어 배포한다.
          # 안 붙이면 Laravel Cloud 가 호출 시점의 브랜치 최신 커밋을 가져가는데,
          # 테스트가 도는 동안 푸시가 하나 더 들어오면 검증 안 된 커밋이 나간다.
          sep='?'
          case "$HOOK" in *\?*) sep='&' ;; esac
          target="${HOOK}${sep}commit_hash=${GITHUB_SHA}"

          # -sS 로 진행률은 숨기되 오류는 보이게. URL 자체는 절대 출력하지 않는다.
          code=$(curl -sS -o /tmp/hook.out -w '%{http_code}' -X POST "$target" --max-time 60 || echo 000)
          echo "deploy hook 응답: HTTP $code"
          head -c 500 /tmp/hook.out || true
          echo

          case "$code" in
            2*) echo "::notice title=배포 시작됨::Laravel Cloud 가 ${GITHUB_SHA:0:7} 배포를 시작했습니다." ;;
            000) echo "::error title=배포 요청 실패::Deploy Hook 에 연결하지 못했습니다."; exit 1 ;;
            # 3xx 는 대시보드 "페이지" 주소를 넣었을 때 나온다. 로그인 안 된 상태로 화면을
            # 여니 Laravel 이 첫 화면으로 되돌려보내는 것이다. 훅은 리다이렉트하지 않는다.
            # 여기서 -L 로 따라가면 첫 화면 HTML 을 200 으로 받아 "성공" 으로 오인하게 된다.
            3*) echo "::error title=훅이 아니라 페이지 주소입니다::HTTP $code — 브라우저 주소창의 대시보드 URL 로 보입니다. Settings → Deployments → Deploy hook 토글을 켠 뒤 거기 표시되는 전용 주소를 넣으세요."; exit 1 ;;
            401|403) echo "::error title=훅이 거부됨::HTTP $code — 주소는 맞지만 토큰이 만료됐거나 재발급된 것 같습니다. Deploy hook 을 재발급해 시크릿을 갱신하세요."; exit 1 ;;
            404) echo "::error title=훅을 찾을 수 없음::HTTP $code — 주소 일부만 복사됐거나 훅이 삭제된 것 같습니다. 전체 주소를 다시 복사하세요."; exit 1 ;;
            *)   echo "::error title=배포 요청 거부됨::HTTP $code — Hook URL 이 유효한지 확인하세요."; exit 1 ;;
          esac

      - name: Verify the deployed build
        if: success()
        env:
          BASE: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$BASE" ]; then
            echo "::notice title=확인 건너뜀::STAGING_URL 변수가 없어 배포 결과를 확인하지 못했습니다."
            exit 0
          fi

          # 배포는 비동기라 잠시 기다렸다가 /build-version 이 이번 커밋으로 바뀌는지 본다.
          want="${GITHUB_SHA:0:7}"
          for i in $(seq 1 20); do
            sleep 30
            got=$(curl -sS --max-time 20 "$BASE/build-version" | sed -n 's/.*"commit_short" *: *"\([^"]*\)".*/\1/p')
            echo "  ${i}회차 — 서버: ${got:-응답없음} / 기대: $want"
            if [ "$got" = "$want" ]; then
              echo "::notice title=배포 확인됨::$want 가 staging 에 반영되었습니다."
              exit 0
            fi
          done
          echo "::warning title=확인 못 함::10분 안에 $want 로 바뀌지 않았습니다. Laravel Cloud 배포 로그를 확인하세요."
