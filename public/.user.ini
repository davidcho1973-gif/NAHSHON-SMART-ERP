; 업로드 한도 — PHP 기본값(2M/8M)은 요즘 폰 사진 한 장도 못 받는다.
;
; 상황실 사진·문서함 스캔은 원본을 그대로 받는 것이 목적이라, PHP 단에서 먼저 잘리면
; 애플리케이션 코드가 아무리 관대해도 소용이 없다(요청이 Laravel 에 도달조차 못 한다).
; 사진은 한 요청에 한 장씩 올리므로 한 장 기준으로만 넉넉하면 된다.
;
; PHP-FPM 은 문서 루트의 .user.ini 를 읽는다(두 값 모두 PHP_INI_PERDIR).
upload_max_filesize = 64M
post_max_size = 72M

; 큰 이미지를 GD 로 줄일 때 필요한 여유. 4032×3024 트루컬러 한 장이 약 46MB 를 쓴다.
memory_limit = 512M

; 업로드 자체가 느린 현장 회선을 감안한다(판독은 응답 후에 돌므로 여기서 오래 잡지 않는다).
max_input_time = 300
